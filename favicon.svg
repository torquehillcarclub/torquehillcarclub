<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="redGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ff1744;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#e31c25;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#b71c1c;stop-opacity:1" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background circle -->
  <circle cx="50" cy="50" r="48" fill="#0a0a0a" stroke="url(#redGrad)" stroke-width="3"/>
  
  <!-- Stylized "T" letter -->
  <g filter="url(#glow)">
    <!-- Top horizontal bar -->
    <rect x="25" y="25" width="50" height="10" fill="url(#redGrad)" rx="2"/>
    
    <!-- Vertical bar -->
    <rect x="45" y="25" width="10" height="55" fill="url(#redGrad)" rx="2"/>
    
    <!-- Speed accent lines -->
    <line x1="20" y1="45" x2="30" y2="45" stroke="#ff1744" stroke-width="2" stroke-linecap="round" opacity="0.7"/>
    <line x1="70" y1="45" x2="80" y2="45" stroke="#ff1744" stroke-width="2" stroke-linecap="round" opacity="0.7"/>
    <line x1="20" y1="55" x2="28" y2="55" stroke="#ff1744" stroke-width="2" stroke-linecap="round" opacity="0.5"/>
    <line x1="72" y1="55" x2="80" y2="55" stroke="#ff1744" stroke-width="2" stroke-linecap="round" opacity="0.5"/>
  </g>
</svg>
